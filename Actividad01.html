<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 01 - Repaso de HTML</title>
</head>
<body>
    <h1>Fotos de mascotas</h1>
    <h2>Fotos de Jade</h2>

    <p>
        Este es un párrafo con <em>texto en cursiva</em> y 
        <strong>texto en negrita</strong> para practicar los formatos.
    </p>

    <ul>
        <li>Elemento uno</li>
        <li>Elemento dos</li>
        <li>Elemento tres</li>
    </ul>

    <figure>
        <img src="images01/Jade.jpeg" alt="Mi perrita Jade" width="300">
        <figcaption>Esta es una imagen con su descripción.</figcaption>
    </figure>

    <a href="https://www.pexels.com/es-es/buscar/perros/" target="_blank">Visitar página con fotos de perros</a>

    <br><br>

    <form action="#" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
